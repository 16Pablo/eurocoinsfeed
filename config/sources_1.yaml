# =============================================================================
#  config/sources.yaml — fuentes del feed de monedas de euro (parche 2)
# =============================================================================
#  Cada fuente necesita:  id, country, name.  Todo lo demás es opcional.
#
#    section_url   página que se rastrea (listado de noticias o sección de monedas)
#    feeds         RSS/Atom oficiales (lista). Si responden se leen y, ADEMÁS, se rastrea
#                  section_url, salvo que se ponga  scrape: false
#    scrape        false = no rastrear section_url cuando el feed ya lo cubre
#    coin_filter   strict (por defecto): hace falta "euro" + moneda + algo concreto
#                  news: fuentes que solo hablan de monedas (no hace falta "euro")
#                  all:  basta una palabra de moneda en el titular (solo feeds de tienda/ceca)
#                  any:  entra todo (feeds que SOLO publican monedas)
#    kind          etiqueta para lo que el filtro no sepa clasificar (p. ej. commemorative_2_euro)
#    title_prefix  texto que se antepone al titular
#    browser_ua    true = pedir las páginas con cabeceras de navegador. Se probó con las 7 webs que dan 403
#                  desde GitHub y NO desbloqueó ninguna: bloquean por IP o por huella, no por cabeceras
#    max_age_days  ignora elementos cuya fecha CONOCIDA sea más antigua que esto
#    max_items     máximo de enlaces aceptados al rastrear una página (25 por defecto)
#    menu_links    true = NO descartar enlaces de menús/cabeceras/pies (por defecto se descartan)
#    coins_section true = section_url es una página dedicada solo a monedas
#    watch         páginas estáticas que se vigilan: si cambia su texto sale un aviso
#                  (lista de URLs o de {url, title}); la primera vez solo se guarda el punto de partida
#    type          eurlex_sparql | boe | watch   (fuentes que no son una web normal)
#
#  Después de cada ejecución mira data/diagnostics.json: dice por fuente qué respondió
#  (http, feeds_tried, sparql, boe, watch...) y qué enlaces con aspecto de moneda ha visto (coin_links).
# =============================================================================

sources:

  # ───────────────────────────── UNIÓN EUROPEA ─────────────────────────────
  # Diario Oficial (EUR-Lex) por la vía de datos abiertos de la Oficina de Publicaciones.
  # La búsqueda web de EUR-Lex devolvía 202 sin contenido a los bots; esto la sustituye.
  # Solo entran los avisos de la serie C (p. ej. "New national side of euro coins intended for circulation").
  # OJO: se publican meses DESPUÉS de la emisión y el título no dice el país: el enlace lo muestra.
  - id: eurlex_sparql
    country: EU
    name: EUR-Lex — Diario Oficial de la UE
    type: eurlex_sparql
    since_days: 500        # (ver más atrás de lo normal enseña los avisos de 2025-2026; luego puedes bajarlo a 180)

  # ALTERNATIVA OFICIAL con tu cuenta de EUR-Lex (ver las instrucciones del mensaje):
  # crea una "alerta RSS" en EUR-Lex, copia su dirección y descomenta este bloque.
  # - id: eurlex_alerta
  #   country: EU
  #   name: EUR-Lex — alerta RSS personal
  #   feeds:
  #     - https://eur-lex.europa.eu/EN/display-feed.rss?myRssId=PEGA_AQUI_TU_NUMERO
  #   coin_filter: news

  # Comisión Europea: catálogo oficial de monedas conmemorativas de 2 € de TODOS los países
  # (incluidos Andorra, Mónaco, San Marino y Vaticano). Todo lo que publica es una moneda.
  - id: ec_commemorative
    country: EU
    name: Comisión Europea — monedas conmemorativas de 2 €
    section_url: https://economy-finance.ec.europa.eu/euro/euro-coins-and-notes/euro-coins/commemorative-coins_en
    feeds:
      - https://economy-finance.ec.europa.eu/node/2553/rss_en
    scrape: false
    coin_filter: any
    kind: commemorative_2_euro
    title_prefix: "2 € conmemorativa (Comisión Europea): "
    max_age_days: 4

  - id: ecb
    country: EU
    name: European Central Bank
    section_url: https://www.ecb.europa.eu/press/html/index.en.html
    feeds:
      - https://www.ecb.europa.eu/rss/press.xml
    scrape: false

  # ───────────────────────────── AUSTRIA ─────────────────────────────
  # (el OeNB no tiene RSS de noticias y su página de monedas de 2 € llega solo hasta 2024)
  - id: austria_mint
    country: AT
    name: Münze Österreich
    section_url: https://www.muenzeoesterreich.at/

  # ───────────────────────────── BÉLGICA ─────────────────────────────
  # La Real Casa de la Moneda publica sus notas por el portal de noticias del Gobierno federal.
  # Los RSS son oficiales y verificados (10 notas cada uno, todas las áreas del Gobierno).
  # La misma nota puede salir en francés y en neerlandés: son dos avisos.
  - id: belgium_federal_news
    country: BE
    name: Gobierno federal belga — news.belgium.be
    section_url: https://news.belgium.be/fr
    feeds:
      - https://news.belgium.be/fr/feeds/all
      - https://news.belgium.be/nl/feeds/all
    scrape: false

  - id: belgium_finances
    country: BE
    name: SPF Finances
    section_url: https://finances.belgium.be/en/Actueel/overview
    feeds:
      - https://finance.belgium.be/en/Actueel/rss.xml
    scrape: false

  # ───────────────────────────── ALEMANIA ─────────────────────────────
  - id: germany_bundesbank
    country: DE
    name: Deutsche Bundesbank
    section_url: https://www.bundesbank.de/en/tasks/cash-management/euro-coins
    feeds:
      - https://www.bundesbank.de/service/rss/en/633306/feed.rss

  - id: germany_mint
    country: DE
    name: MÜNZE DEUTSCHLAND
    section_url: https://www.muenze-deutschland.de/

  - id: germany_bmf
    country: DE
    name: Bundesministerium der Finanzen
    section_url: https://www.bundesfinanzministerium.de/Web/DE/Presse/Pressemitteilungen/pressemitteilungen.html
    feeds:
      - https://www.bundesfinanzministerium.de/SiteGlobals/Functions/RSSFeed/DE/Pressemitteilungen/RSSPressemitteilungen.xml
    # 503 desde GitHub (bloqueado)

  # ───────────────────────────── ESPAÑA ─────────────────────────────
  - id: spain_bde
    country: ES
    name: Banco de España
    section_url: https://www.bde.es/wbe/en/areas-actuacion/billetes-monedas/
    feeds:
      - https://www.bde.es/wbe/es/inicio/rss/rss-noticias/

  # Las órdenes ministeriales de acuñación y puesta en circulación se publican en el BOE.
  - id: spain_boe
    country: ES
    name: BOE — Boletín Oficial del Estado
    type: boe
    days_back: 4

  - id: spain_fnmt
    country: ES
    name: FNMT — Real Casa de la Moneda
    section_url: https://www.fnmt.es/prensa/notas-de-prensa
    coin_filter: news
    max_age_days: 180
    watch:
      - url: https://www.fnmt.es/productos-y-servicios/moneda-y-billetes/moneda-circulante/emisiones-de-2-euros
        title: FNMT · Emisiones de 2 euros

  # ───────────────────────────── FINLANDIA ─────────────────────────────
  # (la página de medios del Banco de Finlandia dejó de existir: 404)
  - id: finland_mint
    country: FI
    name: Helsinkimint / Mint of Finland
    section_url: https://www.helsinkimint.com/

  # ───────────────────────────── FRANCIA ─────────────────────────────
  - id: france_bdf
    country: FR
    name: Banque de France
    section_url: https://www.banque-france.fr/en/press-and-media
    # 403 desde GitHub (bloqueado)

  - id: france_mdp
    country: FR
    name: Monnaie de Paris
    section_url: https://www.monnaiedeparis.fr/

  # ───────────────────────────── IRLANDA ─────────────────────────────
  - id: ireland
    country: IE
    name: Central Bank of Ireland
    section_url: https://www.centralbank.ie/news-media

  - id: ireland_collector_coins
    country: IE
    name: Collector Coins — Central Bank of Ireland
    section_url: https://www.collectorcoins.ie/

  # ───────────────────────────── ITALIA ─────────────────────────────
  - id: italy_bdi
    country: IT
    name: Banca d’Italia
    section_url: https://www.bancaditalia.it/media/notizie/index.html

  - id: italy_ipzs
    country: IT
    name: Istituto Poligrafico e Zecca dello Stato
    section_url: https://www.ipzs.it/

  # ───────────────────────────── LUXEMBURGO ─────────────────────────────
  # (la página de comunicados del BCL se pinta con JavaScript y llega vacía; el RSS del
  #  Gobierno es oficial y verificado, pero cubre todos los ministerios)
  - id: luxembourg_gov
    country: LU
    name: Gouvernement du Luxembourg
    section_url: https://gouvernement.lu/fr/actualites/toutes_actualites.html
    feeds:
      - https://gouvernement.lu/fr/actualites/toutes_actualites.rss
    scrape: false

  # ───────────────────────────── PAÍSES BAJOS ─────────────────────────────
  - id: netherlands_dnb
    country: NL
    name: De Nederlandsche Bank
    section_url: https://www.dnb.nl/en/news-and-archive/
    feeds:
      - https://www.dnb.nl/en/rss/16451/6882
    # 403 desde GitHub (bloqueado)

  - id: netherlands_mint
    country: NL
    name: Royal Dutch Mint
    section_url: https://www.royaldutchmint.com/

  # ───────────────────────────── PORTUGAL ─────────────────────────────
  - id: portugal_bdp
    country: PT
    name: Banco de Portugal
    section_url: https://www.bportugal.pt/en
    # 403 desde GitHub (bloqueado)
    coin_filter: news

  # El RSS de la Casa da Moeda funciona (verificado), pero sus titulares dicen "Moeda dedicada a…"
  # sin la palabra "euro": hace falta el filtro news.
  - id: portugal_incm
    country: PT
    name: Imprensa Nacional-Casa da Moeda
    section_url: https://www.incm.pt/
    feeds:
      - https://incm.pt/site/feed/
    scrape: false
    coin_filter: news

  # ───────────────────────────── GRECIA ─────────────────────────────
  - id: greece
    country: GR
    name: Bank of Greece
    section_url: https://www.bankofgreece.gr/en/news-and-media
    # 403 desde GitHub (bloqueado)
    coin_filter: news

  # ───────────────────────────── ESLOVENIA ─────────────────────────────
  # Sección de numismática: avisos como "Call for proposals for events to be commemorated by issuing
  # occasional coins" no dicen "euro", por eso el filtro news.
  - id: slovenia
    country: SI
    name: Banka Slovenije
    section_url: https://www.bsi.si/en/cash/numismatics
    coin_filter: news

  # ───────────────────────────── CHIPRE ─────────────────────────────
  # El listado no tiene texto en los enlaces: se usa el título que lleva la propia URL
  - id: cyprus
    country: CY
    name: Central Bank of Cyprus
    section_url: https://www.centralbank.cy/en/announcements
    coin_filter: news
    max_age_days: 180

  # ───────────────────────────── MALTA ─────────────────────────────
  - id: malta
    country: MT
    name: Central Bank of Malta
    section_url: https://www.centralbankmalta.org/euro-coins
    feeds:
      - https://www.centralbankmalta.org/rssnews.ashx
    scrape: false
    # 403 desde GitHub (bloqueado)
    coin_filter: news
    max_age_days: 180

  # ───────────────────────────── ESLOVAQUIA ─────────────────────────────
  # La web del NBS cambió de dirección (la antigua daba 404). El RSS general responde (10 entradas);
  # el calendario 2026-2030 es una tabla con las fechas de emisión: se vigila.
  - id: slovakia_nbs
    country: SK
    name: Národná banka Slovenska
    section_url: https://nbs.sk/en/banknotes-and-coins/euro-coins/news/
    feeds:
      - https://nbs.sk/feed
    coin_filter: news
    watch:
      - url: https://nbs.sk/en/banknotes-and-coins/euro-coins/issue-plan/
        title: NBS · Calendario de emisión 2026-2030

  - id: slovakia_mint
    country: SK
    name: Mincovňa Kremnica
    section_url: https://www.mint.sk/

  # ───────────────────────────── ESTONIA ─────────────────────────────
  # Listado de notas de prensa etiquetadas "meenemünt" (monedas) del Eesti Pank
  - id: estonia
    country: EE
    name: Eesti Pank
    section_url: https://www.eestipank.ee/en/keyword/meenemunt
    coin_filter: news
    max_age_days: 180
    watch:
      - url: https://www.eestipank.ee/en/notes-coins/confirmed-programme-issuing-collector-and-commemorative-coins
        title: Eesti Pank · Programa confirmado de monedas

  # ───────────────────────────── LETONIA ─────────────────────────────
  # Noticias del Latvijas Banka con la etiqueta "New coins"
  - id: latvia
    country: LV
    name: Latvijas Banka
    section_url: https://www.bank.lv/en/news-and-events/news-and-articles/news?tag=new-coins
    coin_filter: news
    max_age_days: 180

  # ───────────────────────────── LITUANIA ─────────────────────────────
  - id: lithuania_lb
    country: LT
    name: Lietuvos bankas
    section_url: https://www.lb.lt/en/coins
    coins_section: true
    feeds:
      - https://www.lb.lt/en/news/rss
    # 403 desde GitHub (bloqueado)
    coin_filter: news

  - id: lithuania_mint
    country: LT
    name: Lithuanian Mint
    section_url: https://lithuanian-mint.lt/
    coin_filter: news

  # ───────────────────────────── CROACIA ─────────────────────────────
  # La página del plan de emisión 2026 es una lista de nombres de monedas sin fechas:
  # lo útil es saber cuándo cambia.
  - id: croatia_hnb
    country: HR
    name: Croatian National Bank
    section_url: https://www.hnb.hr/en/currency/euro-coins
    watch:
      - url: https://www.hnb.hr/en/currency/euro-coins/issuance-of-commemorative-and-collector-euro-coins/euro-coin-issuance-plan
        title: HNB · Plan de emisión de monedas

  - id: croatia_mint
    country: HR
    name: Croatian Mint
    section_url: https://croatian-mint.hr/

  # ───────────────────────────── BULGARIA ─────────────────────────────
  - id: bulgaria_bnb
    country: BG
    name: Bulgarian National Bank
    section_url: https://www.bnb.bg/NotesAndCoins/index.htm

  - id: bulgaria_mint
    country: BG
    name: Bulgarian Mint
    section_url: https://www.mint.bg/

  # ───────────────────── MICROESTADOS (emisores de euros) ─────────────────────
  # Sus 2 € conmemorativas llegan por el RSS de la Comisión Europea (ec_commemorative).
  - id: monaco
    country: MC
    name: Gouvernement Princier de Monaco
    section_url: https://www.gouv.mc/

  # (la web de San Marino da error SSL desde GitHub; los dos registros antiguos eran la misma web)
  - id: san_marino
    country: SM
    name: Divisione Filatelica Numismatica
    section_url: https://www.aasfn.sm/
    coin_filter: news

  # Etiqueta oficial "New numismatic issues" del Governatorato
  - id: vatican
    country: VA
    name: Vatican City State
    section_url: https://vaticanstate.va/en/component/tags/tag/new-numismatic-issues.html
    coin_filter: news

  - id: andorra
    country: AD
    name: Govern d'Andorra
    section_url: https://www.govern.ad/
    coin_filter: news

# -----------------------------------------------------------------------------
# Estas dos listas YA NO SE USAN (el filtro está en src/relevance.py), pero build_feed.py
# las carga al arrancar: no las borres.
# -----------------------------------------------------------------------------
include:
  - euro coin
  - euro coins
  - euro coin intended for circulation
  - circulation coin
  - circulating coin
  - commemorative 2 euro
  - commemorative 2-euro
  - 2 euro commemorative
  - 2-euro commemorative
  - national side
  - new national side
  - euro coins issued
  - coins in circulation
  - monedas de euro
  - moneda conmemorativa de 2 euros
  - monedas destinadas a la circulación
  - pièces en euros
  - pièce commémorative de 2 euros
  - pièces destinées à la circulation
  - monete euro
  - moneta commemorativa da 2 euro
  - 2-Euro-Gedenkmünze
  - 2 euron juhlaraha
  - 2-euromunt
  - 2-euromünze
  - 2-euro commemorative coin

exclude:
  - banknote
  - billet
  - billete
  - medaglia
  - medal
  - medalha
  - medalje
  - token
  - jeton
  - gold coin
  - silver coin
  - bullion
  - collector coin
  - monnaie de collection
  - moneda de colección
  - sammlermünze
  - set coincard
